name: Validate GIF gallery
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Check metadata synchronization
        run: |
          python tools/sync_gallery_js.py
          git diff --exit-code -- docs/data/gallery.js
          python tools/sync_media_js.py
          git diff --exit-code -- docs/data/media.js
      - name: Validate GIF frames, timing and prompt files
        run: python tools/validate_gallery.py
      - name: Check idea catalog data and previews
        run: |
          python tools/sync_ideas.py
          git diff --exit-code -- docs/data/ideas.js
          python tools/validate_ideas.py
      - name: Check media manifest cross-links
        run: python tools/validate_media.py
      - name: Check popular GIF remake catalog
        run: |
          python tools/sync_popular.py
          git diff --exit-code -- docs/data/popular.js playbooks/popular-gifs.md
          python tools/validate_popular.py
