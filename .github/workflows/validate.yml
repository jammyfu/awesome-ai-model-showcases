name: Validate GIF gallery
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Install ffmpeg for MP4 stream/duration probe
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/showcase-browser" --no-save --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/showcase-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify catalog, local media, generated files, and browser playback
        env:
          RUN_BROWSER_TESTS: '1'
          NODE_PATH: ${{ runner.temp }}/showcase-browser/node_modules
        run: python tools/verify.py
