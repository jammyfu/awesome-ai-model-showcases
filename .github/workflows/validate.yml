name: Validate GIF gallery
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Install ffmpeg when approved videos require stream probes
        run: |
          if python -c "import json,sys; a=json.load(open('data/public-media-rights.json'))['assets']; sys.exit(0 if any(x['path'].endswith(('.mp4','.webm','.mov')) for x in a) else 1)"; then
            if ! command -v ffprobe >/dev/null; then
              timeout 180 sudo apt-get update -o Acquire::Retries=1
              timeout 180 sudo apt-get install -y ffmpeg
            fi
            ffprobe -version
          else
            echo "No video files are approved for publication. GIFs are decoded with Pillow and animated in Chromium; archival LFS pointers remain metadata-only."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/showcase-browser" --no-save --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/showcase-browser/node_modules/.bin/playwright" install chromium
          # Hosted runners already carry browser libraries. Install only if an
          # actual launch proves they are missing, rather than updating apt twice.
          if ! NODE_PATH="$RUNNER_TEMP/showcase-browser/node_modules" node -e "require('playwright').chromium.launch().then(b => b.close())"; then
            timeout 180 "$RUNNER_TEMP/showcase-browser/node_modules/.bin/playwright" install-deps chromium
          fi
      - name: Verify catalog, local media, generated files, and browser playback
        env:
          RUN_BROWSER_TESTS: '1'
          GALLERY_SCREENSHOTS: ${{ runner.temp }}/gallery-screenshots
          NODE_PATH: ${{ runner.temp }}/showcase-browser/node_modules
        run: python tools/verify.py
      - name: Keep rendered gallery review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: licensed-gallery-render-review
          path: ${{ runner.temp }}/gallery-screenshots
          if-no-files-found: warn
          retention-days: 7
